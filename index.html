<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarryNight - Wallpaper Engine</title>
  <style>
    :root {
      --spice-sidebar: #142b44;
      --spice-sidebar-alt: #000000;
      --spice-text: #FFFFFF;
      --spice-subtext: #ADB5BD;
      --spice-button: #FFF3C4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--spice-text);
      background: linear-gradient(180deg, var(--spice-sidebar-alt) 0%, var(--spice-sidebar) 100%);
      transition: background 0.5s ease;
    }

    #skyCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      display: block;
    }

    .center-stage {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .clock-widget {
      text-align: center;
      display: none;
    }

    .clock-time {
      font-size: clamp(3rem, 6vw, 5.2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--spice-text);
      line-height: 1.05;
    }

    .clock-date {
      margin-top: 8px;
      font-size: clamp(0.9rem, 1.5vw, 1.15rem);
      color: var(--spice-subtext);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Subtle hover trigger zone in top-right corner for URL mode */
    .corner-trigger {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 30;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 20, 35, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.15;
      transition: opacity 0.25s ease, transform 0.2s ease;
      font-size: 16px;
    }

    .corner-trigger:hover,
    .corner-trigger.active {
      opacity: 1;
      transform: scale(1.06);
    }

    .settings-panel {
      position: fixed;
      top: 58px;
      right: 14px;
      z-index: 30;
      width: 260px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(10, 14, 24, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .settings-panel.open {
      display: flex;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .settings-panel select {
      background: #182036;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      width: 140px;
    }

    .settings-panel input[type="range"] {
      width: 120px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="skyCanvas"></canvas>

  <main class="center-stage">
    <section id="clockWidget" class="clock-widget">
      <div id="clockTime" class="clock-time">00:00</div>
      <div id="clockDate" class="clock-date"></div>
    </section>
  </main>

  <!-- Subtle corner button so settings can be changed even when loaded from URL -->
  <button id="gearBtn" class="corner-trigger" title="Ayarlar">⚙</button>

  <div id="settingsPanel" class="settings-panel">
    <div class="settings-row">
      <span>Renk Teması:</span>
      <select id="themeSelect">
        <option value="Base">Base (Gece Mavisi)</option>
        <option value="Cotton-candy">Cotton Candy</option>
        <option value="Forest">Forest</option>
        <option value="Galaxy">Galaxy</option>
        <option value="Orange">Orange</option>
        <option value="Sky">Sky</option>
        <option value="Sunrise">Sunrise</option>
      </select>
    </div>

    <div class="settings-row">
      <span>Yıldız Yoğunluğu:</span>
      <input id="densityInput" type="range" min="0.2" max="3.0" step="0.1" value="1.0" />
    </div>

    <div class="settings-row">
      <span>Kayan Yıldız:</span>
      <input id="shootingInput" type="range" min="0" max="12" step="1" value="4" />
    </div>

    <div class="settings-row">
      <span>Kayan Yıldız Hızı:</span>
      <input id="speedInput" type="range" min="0.5" max="2.5" step="0.1" value="1.0" />
    </div>

    <label class="settings-row" style="cursor:pointer;">
      <span>Saat ve Tarih Göster:</span>
      <input id="clockCheck" type="checkbox" />
    </label>

    <label class="settings-row" style="cursor:pointer;">
      <span>Fare Paralaks Hareketi:</span>
      <input id="parallaxCheck" type="checkbox" />
    </label>
  </div>

  <script>
    (function () {
      var THEMES = {
        'Base': {
          star: '#FFFFFF',
          shootingStarGlowRgb: '255, 255, 255',
          sidebar: '#142b44',
          sidebarAlt: '#000000',
          text: '#FFFFFF',
          subtext: '#ADB5BD'
        },
        'Cotton-candy': {
          star: '#FFFFFF',
          shootingStarGlowRgb: '255, 255, 255',
          sidebar: '#509be1',
          sidebarAlt: '#ff71b2',
          text: '#FFFFFF',
          subtext: '#fff4f4'
        },
        'Forest': {
          star: '#FFFFFF',
          shootingStarGlowRgb: '255, 255, 255',
          sidebar: '#14442b',
          sidebarAlt: '#000000',
          text: '#FFFFFF',
          subtext: '#ADB5BD'
        },
        'Galaxy': {
          star: '#FFFFFF',
          shootingStarGlowRgb: '255, 255, 255',
          sidebar: '#b133c9',
          sidebarAlt: '#00076f',
          text: '#ffe4f2',
          subtext: '#FFFFFF'
        },
        'Orange': {
          star: '#ffe234',
          shootingStarGlowRgb: '255, 252, 234',
          sidebar: '#e69138',
          sidebarAlt: '#000000',
          text: '#FFFFFF',
          subtext: '#FFFFFF'
        },
        'Sky': {
          star: '#FFFFFF',
          shootingStarGlowRgb: '255, 255, 255',
          sidebar: '#62cff4',
          sidebarAlt: '#1e48a9',
          text: '#FFFFFF',
          subtext: '#d8e6ff'
        },
        'Sunrise': {
          star: '#FFFFFF',
          shootingStarGlowRgb: '255, 255, 255',
          sidebar: '#F83D41',
          sidebarAlt: '#FFAE41',
          text: '#FFFFFF',
          subtext: '#E0E0E0'
        }
      };

      var state = {
        themePreset: 'Base',
        customTop: '#000000',
        customBottom: '#142b44',
        customStar: '#FFFFFF',
        customStarRgb: '255, 255, 255',
        starDensity: 1.0,
        shootingStarCount: 4,
        shootingSpeed: 1.0,
        showClock: false,
        mouseParallax: false
      };

      // Load saved settings from localStorage or URL query params (?theme=Galaxy&density=1.5&shooters=4&clock=1)
      try {
        var saved = localStorage.getItem('starrynight_settings');
        if (saved) {
          var parsed = JSON.parse(saved);
          for (var k in parsed) {
            if (Object.prototype.hasOwnProperty.call(state, k)) state[k] = parsed[k];
          }
        }
        var params = new URLSearchParams(window.location.search);
        if (params.get('theme') && THEMES[params.get('theme')]) state.themePreset = params.get('theme');
        if (params.get('density')) state.starDensity = parseFloat(params.get('density')) || 1.0;
        if (params.get('shooters')) state.shootingStarCount = parseInt(params.get('shooters'), 10);
        if (params.get('speed')) state.shootingSpeed = parseFloat(params.get('speed')) || 1.0;
        if (params.get('clock')) state.showClock = params.get('clock') === '1' || params.get('clock') === 'true';
        if (params.get('parallax')) state.mouseParallax = params.get('parallax') === '1' || params.get('parallax') === 'true';
      } catch (e) {}

      function saveSettings() {
        try {
          localStorage.setItem('starrynight_settings', JSON.stringify(state));
        } catch (e) {}
      }

      var root = document.documentElement;
      var canvas = document.getElementById('skyCanvas');
      var ctx = canvas.getContext('2d');
      var clockWidget = document.getElementById('clockWidget');
      var clockTime = document.getElementById('clockTime');
      var clockDate = document.getElementById('clockDate');

      var currentColors = THEMES['Base'];
      var stars = [];
      var shooters = [];
      var parallaxX = 0;
      var parallaxY = 0;

      function random(min, max) {
        return Math.random() * (max - min) + min;
      }

      function applyThemeColors() {
        currentColors = THEMES[state.themePreset] || THEMES['Base'];
        root.style.setProperty('--spice-sidebar', currentColors.sidebar);
        root.style.setProperty('--spice-sidebar-alt', currentColors.sidebarAlt);
        root.style.setProperty('--spice-text', currentColors.text);
        root.style.setProperty('--spice-subtext', currentColors.subtext);
        clockWidget.style.display = state.showClock ? 'block' : 'none';
      }

      function createShooter(initialDelay) {
        var w = canvas.width || 1920;
        var h = canvas.height || 1080;
        var startX, startY;
        if (Math.random() < 0.75) {
          startX = random(w * 0.1, w);
          startY = -10;
        } else {
          startX = w + 10;
          startY = random(0, h * 0.5);
        }
        var duration = random(3.0, 6.0) / state.shootingSpeed;
        var delay = initialDelay ? random(0, 6.0) : random(0.2, 2.5);
        return {
          startX: startX,
          startY: startY,
          duration: duration,
          elapsed: -delay
        };
      }

      function rebuildSky() {
        var w = Math.max(document.documentElement.clientWidth, window.innerWidth || 1920);
        var h = Math.max(document.documentElement.clientHeight, window.innerHeight || 1080);
        canvas.width = w;
        canvas.height = h;

        var count = Math.min(1000, Math.floor(((w * h) / 4000) * state.starDensity));
        stars = [];
        for (var i = 0; i < count; i++) {
          var size = Math.random() < 0.5 ? 1 : 2;
          stars.push({
            x: random(0, w),
            y: random(0, h),
            r: size * 0.65,
            alpha: random(0.5, 1.0),
            twinkles: Math.random() < 0.2,
            phase: random(0, Math.PI * 2),
            speed: (Math.PI * 2) / 5.0
          });
        }

        shooters = [];
        for (var j = 0; j < state.shootingStarCount; j++) {
          shooters.push(createShooter(true));
        }
      }

      var lastTime = performance.now();
      function renderLoop(now) {
        var dt = Math.min(0.1, (now - lastTime) / 1000);
        lastTime = now;

        var w = canvas.width;
        var h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        ctx.save();
        if (state.mouseParallax) {
          ctx.translate(parallaxX, parallaxY);
        }

        var starColor = currentColors.star;
        var glowRgb = currentColors.shootingStarGlowRgb;

        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          if (s.twinkles) {
            s.phase += dt * s.speed;
            var glowFactor = Math.max(0, Math.sin(s.phase));
            if (glowFactor > 0.15) {
              ctx.beginPath();
              ctx.arc(s.x, s.y, s.r + 3.5 * glowFactor, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(' + glowRgb + ', ' + (0.28 * glowFactor).toFixed(2) + ')';
              ctx.fill();
            }
          }
          ctx.globalAlpha = s.alpha;
          ctx.fillStyle = starColor;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        var cos45 = 0.70710678;
        var sin45 = 0.70710678;
        var travelDist = 1500;
        var tailLen = 300;

        for (var k = 0; k < shooters.length; k++) {
          var sh = shooters[k];
          sh.elapsed += dt;
          if (sh.elapsed < 0) continue;

          var t = sh.elapsed / sh.duration;
          if (t >= 1.0) {
            shooters[k] = createShooter(false);
            continue;
          }

          var dist = t * travelDist;
          var headX = sh.startX - dist * cos45;
          var headY = sh.startY + dist * sin45;
          var tailX = headX + tailLen * cos45;
          var tailY = headY - tailLen * sin45;

          var alpha = t < 0.7 ? 1.0 : Math.max(0, 1.0 - (t - 0.7) / 0.3);

          var grad = ctx.createLinearGradient(headX, headY, tailX, tailY);
          grad.addColorStop(0, 'rgba(' + glowRgb + ', ' + alpha.toFixed(2) + ')');
          grad.addColorStop(1, 'rgba(' + glowRgb + ', 0)');

          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(headX, headY);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();

          ctx.fillStyle = 'rgba(' + glowRgb + ', ' + (0.16 * alpha).toFixed(2) + ')';
          ctx.beginPath();
          ctx.arc(headX, headY, 8, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(' + glowRgb + ', ' + alpha.toFixed(2) + ')';
          ctx.beginPath();
          ctx.arc(headX, headY, 2, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
        requestAnimationFrame(renderLoop);
      }

      function updateClock() {
        var now = new Date();
        var hours = ('0' + now.getHours()).slice(-2);
        var mins = ('0' + now.getMinutes()).slice(-2);
        clockTime.textContent = hours + ':' + mins;
        clockDate.textContent = now.toLocaleDateString('tr-TR', {
          weekday: 'long',
          day: 'numeric',
          month: 'long'
        });
      }
      updateClock();
      setInterval(updateClock, 1000);

      window.addEventListener('mousemove', function (e) {
        if (!state.mouseParallax) {
          parallaxX = 0;
          parallaxY = 0;
          return;
        }
        parallaxX = (e.clientX / (window.innerWidth || 1) - 0.5) * -18;
        parallaxY = (e.clientY / (window.innerHeight || 1) - 0.5) * -18;
      });

      window.addEventListener('resize', rebuildSky);

      // UI Controls sync
      var gearBtn = document.getElementById('gearBtn');
      var settingsPanel = document.getElementById('settingsPanel');
      var themeSelect = document.getElementById('themeSelect');
      var densityInput = document.getElementById('densityInput');
      var shootingInput = document.getElementById('shootingInput');
      var speedInput = document.getElementById('speedInput');
      var clockCheck = document.getElementById('clockCheck');
      var parallaxCheck = document.getElementById('parallaxCheck');

      themeSelect.value = state.themePreset;
      densityInput.value = state.starDensity;
      shootingInput.value = state.shootingStarCount;
      speedInput.value = state.shootingSpeed;
      clockCheck.checked = state.showClock;
      parallaxCheck.checked = state.mouseParallax;

      gearBtn.addEventListener('click', function () {
        settingsPanel.classList.toggle('open');
        gearBtn.classList.toggle('active');
      });

      themeSelect.addEventListener('change', function (e) {
        state.themePreset = e.target.value;
        applyThemeColors();
        saveSettings();
      });

      densityInput.addEventListener('input', function (e) {
        state.starDensity = parseFloat(e.target.value) || 1.0;
        rebuildSky();
        saveSettings();
      });

      shootingInput.addEventListener('input', function (e) {
        state.shootingStarCount = parseInt(e.target.value, 10);
        rebuildSky();
        saveSettings();
      });

      speedInput.addEventListener('input', function (e) {
        state.shootingSpeed = parseFloat(e.target.value) || 1.0;
        rebuildSky();
        saveSettings();
      });

      clockCheck.addEventListener('change', function (e) {
        state.showClock = e.target.checked;
        clockWidget.style.display = state.showClock ? 'block' : 'none';
        saveSettings();
      });

      parallaxCheck.addEventListener('change', function (e) {
        state.mouseParallax = e.target.checked;
        saveSettings();
      });

      applyThemeColors();
      rebuildSky();
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
